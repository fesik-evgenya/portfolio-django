{% load static %}
<div class="image-uploader">
  <div class="uploader-header">
    <h4>{{ title|default:"Загрузка изображений" }}</h4>
    <div class="uploader-info">
      <p>{{ hint|default:"Перетащите файлы сюда или нажмите для выбора" }}</p>
      <small>Максимум: {{ max_files|default:10 }} файлов, {{ max_size|default:"2MB" }} каждый</small>
    </div>
  </div>

  <div class="uploader-dropzone" id="dropzone-{{ id|default:'default' }}">
    <div class="dropzone-content">
      <i class="fas fa-cloud-upload-alt upload-icon"></i>
      <p class="dropzone-text">Перетащите файлы сюда</p>
      <p class="dropzone-subtext">или</p>
      <button type="button" class="btn btn--outline select-files">
        Выберите файлы
      </button>
    </div>

    <input type="file"
           id="file-input-{{ id|default:'default' }}"
           name="{{ name|default:'images' }}"
           class="file-input"
           multiple
           accept="{{ accept|default:'image/*' }}"
           style="display: none;">
  </div>

  <div class="uploader-preview" id="preview-{{ id|default:'default' }}">
    <div class="preview-header">
      <span class="file-counter">Выбрано файлов: <span class="count">0</span></span>
      <button type="button" class="btn btn--text clear-all" style="display: none;">
        Очистить все
      </button>
    </div>
    <div class="preview-grid"></div>
  </div>

  <div class="uploader-status">
    <div class="progress-bar" style="display: none;">
      <div class="progress-fill"></div>
    </div>
    <div class="status-message"></div>
  </div>
</div>
