{% load static %}
<div class="image-item" data-image-id="{{ image.id|default:'' }}" data-image-url="{{ image.url }}">
    <div class="image-item__preview">
        <img src="{{ image.url }}"
             alt="{{ image.alt|default:'Изображение' }}"
             class="image-preview"
             loading="lazy">

        {% if image.is_main %}
        <div class="image-badge badge-main">
            <i class="fas fa-star"></i> Основное
        </div>
        {% endif %}
    </div>

    <div class="image-item__info">
        <div class="image-filename">
            {{ image.filename|default:'' }}
        </div>
        <div class="image-size">
            {{ image.size|filesizeformat|default:'' }}
        </div>
    </div>

    <div class="image-item__actions">
        {% if not image.is_main and can_set_main %}
        <button type="button" class="btn-action set-main" title="Сделать основным">
            <i class="fas fa-star"></i>
        </button>
        {% endif %}

        {% if can_edit %}
        <button type="button" class="btn-action edit" title="Редактировать">
            <i class="fas fa-edit"></i>
        </button>
        {% endif %}

        {% if can_delete %}
        <button type="button" class="btn-action delete" title="Удалить">
            <i class="fas fa-trash"></i>
        </button>
        {% endif %}
    </div>
</div>
