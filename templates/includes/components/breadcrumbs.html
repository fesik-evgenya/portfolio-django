{% load static %}

<!-- Базовый шаблон хлебных крошек -->
{% if breadcrumbs %}
<nav aria-label="Хлебные крошки" class="breadcrumbs">
    <ol class="breadcrumbs__list">
        <li class="breadcrumbs__item">
            <a href="{% url 'main:index' %}" class="breadcrumbs__link">
                <i class="fas fa-home"></i>
                Главная
            </a>
        </li>
        {% for crumb in breadcrumbs %}
        <li class="breadcrumbs__item">
            {% if forloop.last %}
            <span class="breadcrumbs__current">{{ crumb.title }}</span>
            {% else %}
            <a href="{{ crumb.url }}" class="breadcrumbs__link">{{ crumb.title }}</a>
            {% endif %}
        </li>
        {% endfor %}
    </ol>
</nav>
{% endif %}
