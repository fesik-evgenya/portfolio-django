{% load static %}
<div class="modal-overlay" id="{{ modal_id }}" style="display: none;">
    <div class="modal-content {% if size %}modal-{{ size }}{% endif %}">
        <div class="modal-header">
            {% if title %}
            <h3 class="modal-title">{{ title }}</h3>
            {% endif %}
            <button type="button" class="modal-close" aria-label="Закрыть">
                &times;
            </button>
        </div>

        <div class="modal-body">
            {{ content|safe }}
        </div>

        {% if actions %}
        <div class="modal-footer">
            {% for action in actions %}
            <button type="button"
                    class="btn btn--{{ action.class|default:'primary' }} {{ action.id|default:'' }}"
                    onclick="{{ action.onclick|default:'' }}"
                    data-action="{{ action.action|default:'' }}">
                {% if action.icon %}<i class="{{ action.icon }}"></i>{% endif %}
                {{ action.text }}
            </button>
            {% endfor %}
        </div>
        {% endif %}
    </div>
</div>
