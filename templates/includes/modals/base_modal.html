{% load static %}

<!-- Базовый шаблон модального окна -->
<div id="{{ modal_id|default:'baseModal' }}" class="modal {% if modal_class %}{{ modal_class }}{% endif %}" aria-hidden="true" role="dialog">
    <div class="modal__overlay" data-close-modal></div>
    <div class="modal__container">
        <div class="modal__header">
            {% if modal_title %}
            <h3 class="modal__title">{{ modal_title }}</h3>
            {% endif %}
            <button class="modal__close" data-close-modal aria-label="Закрыть модальное окно">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="modal__body">
            {% block modal_content %}{% endblock %}
        </div>
        {% block modal_footer %}{% endblock %}
    </div>
</div>
