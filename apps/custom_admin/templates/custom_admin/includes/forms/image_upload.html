<div class="form-group">
    <label class="form-label">{{ field.label }}</label>

    <!-- Область перетаскивания файлов -->
    <div class="file-dropzone border rounded p-5 text-center mb-3"
         style="border-style: dashed !important;">
        <i class="fas fa-cloud-upload-alt fa-3x text-muted mb-3"></i>
        <h5>Кликните для выбора или перетащите файлы</h5>
        <p class="text-muted small mb-2">
            Максимум 10 файлов, не более 2MB каждый<br>
            Рекомендуется 600×400px для превью и 1200×800px для остального контента
        </p>
        <p class="text-muted small">
            Форматы: JPG, PNG, WEBP, GIF
        </p>

        <!-- Скрытый input для файлов -->
        {{ field }}

        <div class="mt-3">
            <span class="badge bg-info" id="fileCounter">0 из 10 файлов</span>
        </div>
    </div>

    <!-- Контейнер для превью -->
    <div class="image-previews row g-2 mt-3" id="imagePreviews"></div>

    <!-- Шаблон для превью -->
    <template id="previewTemplate">
        <div class="col-md-3">
            <div class="preview-item card">
                <img src="" class="card-img-top preview-image" alt="Preview" style="height: 120px; object-fit: cover;">
                <div class="card-body p-2">
                    <div class="preview-filename small text-truncate"></div>
                    <div class="preview-size text-muted small"></div>
                </div>
                <div class="card-footer p-2">
                    <div class="form-check">
                        <input class="form-check-input preview-radio" type="radio" name="preview_radio">
                        <label class="form-check-label small">Превью</label>
                    </div>
                    <button type="button" class="btn btn-sm btn-danger w-100 mt-1 remove-image">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>
        </div>
    </template>
</div>
