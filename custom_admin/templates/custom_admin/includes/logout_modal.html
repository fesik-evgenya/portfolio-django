<div class="modal-overlay logout-modal" id="logoutModal" style="display: none;">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Подтверждение выхода</h2>
      <button type="button" class="modal-close" onclick="closeLogoutModal()">&times;</button>
    </div>
    <div class="modal-body">
      <div class="logout-icon">
        <i class="fas fa-sign-out-alt"></i>
      </div>
      <p class="logout-message">Вы уверены, что хотите выйти из админ-панели?</p>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" onclick="closeLogoutModal()">Отмена</button>
      <button type="button" class="btn btn-primary" onclick="performLogout()">Выйти</button>
    </div>
  </div>
</div>
