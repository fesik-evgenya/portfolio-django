{% extends "base.html" %}
{% load static %}

{% block seo_extra %}
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="googlebot" content="noindex, nofollow, noarchive">
{% endblock %}

{% block styles %}
<link rel="stylesheet" href="{% static 'css/admin/login.css' %}">
{% endblock %}

{% block content %}
<div class="container">
    <h2>Вход в панель управления</h2>
    <form method="POST" id="login-form" autocomplete="off">
        {% csrf_token %}

        <div class="form-group">
            <label for="username">Имя пользователя</label>
            <input type="text" name="username" class="form-control" autocomplete="new-username" id="username-field">
        </div>

        <div class="form-group">
            <label for="password">Пароль</label>
            <input type="password" name="password" class="form-control" autocomplete="new-password" id="password-field">
        </div>

        <div class="form-group remember-me-group">
            <input type="checkbox" name="remember_me" id="remember-me">
            <label for="remember-me">Запомнить меня</label>
        </div>

        <button type="submit" class="btn btn-primary login-btn">Войти</button>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const loginForm = document.getElementById('login-form');
        const usernameField = document.getElementById('username-field');
        const passwordField = document.getElementById('password-field');
        const rememberMe = document.getElementById('remember-me');

        function clearFormFields() {
            usernameField.value = '';
            passwordField.value = '';
            rememberMe.checked = false;
        }

        clearFormFields();

        window.addEventListener('beforeunload', function() {
            if (!rememberMe.checked) {
                clearFormFields();
            }
        });
    });
</script>
{% endblock %}
