{% load static %}
<div class="solution-filters">
    <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="solutionSearch"
               placeholder="Поиск по названию..."
               value="{{ request.GET.search|default:'' }}">
    </div>

    <div class="filter-controls">
        <select id="categoryFilter" class="form-control form-control-sm">
            <option value="">Все категории</option>
            {% for category in categories %}
            <option value="{{ category.slug }}"
                    {% if request.GET.category == category.slug %}selected{% endif %}>
                {{ category.name }}
            </option>
            {% endfor %}
        </select>

        <select id="statusFilter" class="form-control form-control-sm">
            <option value="">Все статусы</option>
            <option value="active" {% if request.GET.status == 'active' %}selected{% endif %}>Активные</option>
            <option value="inactive" {% if request.GET.status == 'inactive' %}selected{% endif %}>Неактивные</option>
        </select>

        <select id="typeFilter" class="form-control form-control-sm">
            <option value="">Все типы</option>
            {% for package_type in package_types %}
            <option value="{{ package_type.0 }}"
                    {% if request.GET.package_type == package_type.0 %}selected{% endif %}>
                {{ package_type.1 }}
            </option>
            {% endfor %}
        </select>

        <button type="button" id="applyFilters" class="btn btn-primary btn-sm">
            <i class="fas fa-filter"></i> Применить
        </button>
        <a href="{% url 'custom_admin:solution_list' %}" class="btn btn-secondary btn-sm">
            <i class="fas fa-redo"></i> Сбросить
        </a>
    </div>
</div>
