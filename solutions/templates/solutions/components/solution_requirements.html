{% load static %}
{% if solution.requirements %}
<div class="solution-requirements">
    <h3>Что нужно для запуска</h3>
    <ul>
        {% for requirement in solution.requirements %}
        <li>
            <i class="fas fa-info-circle"></i>
            {{ requirement }}
        </li>
        {% endfor %}
    </ul>
</div>
{% endif %}
