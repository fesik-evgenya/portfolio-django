{% load static %}
<div class="portfolio-filters">
    <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="portfolioSearch"
               placeholder="Поиск по проектам..."
               value="{{ request.GET.search|default:'' }}">
    </div>

    <div class="filter-controls">
        <select id="categoryFilter" class="form-control form-control-sm">
            <option value="">Все категории</option>
            {% for category in categories %}
            <option value="{{ category.slug }}"
                    {% if request.GET.category == category.slug %}selected{% endif %}>
                {{ category.name }}
            </option>
            {% endfor %}
        </select>

        <select id="packageFilter" class="form-control form-control-sm">
            <option value="">Все пакеты</option>
            {% for package in package_choices %}
            <option value="{{ package.0 }}"
                    {% if request.GET.package == package.0 %}selected{% endif %}>
                {{ package.1 }}
            </option>
            {% endfor %}
        </select>

        <select id="statusFilter" class="form-control form-control-sm">
            <option value="">Все статусы</option>
            <option value="active" {% if request.GET.status == 'active' %}selected{% endif %}>Активные</option>
            <option value="inactive" {% if request.GET.status == 'inactive' %}selected{% endif %}>Неактивные</option>
            <option value="featured" {% if request.GET.status == 'featured' %}selected{% endif %}>Избранные</option>
        </select>

        <button type="button" id="applyFilters" class="btn btn-primary btn-sm">
            <i class="fas fa-filter"></i> Применить
        </button>
        <a href="{% url 'custom_admin:portfolio_list' %}" class="btn btn-secondary btn-sm">
            <i class="fas fa-redo"></i> Сбросить
        </a>
    </div>
</div>
